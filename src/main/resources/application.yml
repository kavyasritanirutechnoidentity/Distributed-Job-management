spring:
  application:
    name: job-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobplatform}
    username: ${DB_USER:jobplatform}
    password: ${DB_PASSWORD:jobplatform}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

security:
  jwt:
    # Dev-only default; override with JWT_SECRET in real deployments (min 32 bytes).
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-please}
    ttl-minutes: ${JWT_TTL_MINUTES:120}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}

temporal:
  service-target: ${TEMPORAL_SERVICE_TARGET:127.0.0.1:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  task-queue: ${TEMPORAL_TASK_QUEUE:job-platform-task-queue}

server:
  address: 127.0.0.1
  port: 8080

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: jobplatform
      POSTGRES_USER: jobplatform
      POSTGRES_PASSWORD: jobplatform
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobplatform -d jobplatform"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Host networking so it can reach the host Postgres on 127.0.0.1:5432
  # and Temporal's published 127.0.0.1:7233 (Linux only).
  backend:
    build: .
    network_mode: host
    environment:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/jobplatform
      DB_USER: jobplatform
      DB_PASSWORD: jobplatform
      TEMPORAL_SERVICE_TARGET: 127.0.0.1:7233
      SERVER_ADDRESS: 127.0.0.1
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - see .env.example}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      - temporal-db
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/development-sql.yaml
    ports:
      - "127.0.0.1:7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-db:
    image: postgres:16
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data

  temporal-ui:
    image: temporalio/ui:2.39.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8233:8080"

volumes:
  postgres-data:
  temporal-db-data:
